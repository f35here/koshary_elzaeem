<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2E6B43" />
    <meta name="description" content="كشري الزعيم - قائمة ذكية للطلب أونلاين" />
    <title>كشري الزعيم | قائمة ذكية</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Anybody:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            -webkit-text-size-adjust: 100%;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #FEF9EF;
            color: #1E2F26;
            padding-bottom: 110px;
            overflow-x: hidden;
            min-height: 100vh;
        }

        img { max-width: 100%; display: block; }

        :root {
            --primary: #2E6B43;
            --primary-dark: #1F4F2E;
            --secondary: #F18825;
            --tertiary: #D32F2F;
            --neutral: #FFFFFF;
            --bg-light: #FFFBF5;
            --gray-soft: #F6F2E9;
            --shadow-sm: 0 6px 18px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 12px 24px rgba(0, 0, 0, 0.08);
            --transition-fast: 0.15s ease;
            --transition-base: 0.25s ease;
        }

        /* ── Header ── */
        .app-header {
            background: var(--neutral);
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 30;
            border-bottom: 2px solid var(--secondary);
        }

        .header-container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .logo-area { display: flex; align-items: center; gap: 10px; min-width: 0; }

        .logo-img {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            background: var(--primary);
            border-radius: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(46, 107, 67, 0.3);
            overflow: hidden;
        }

        .logo-img img { width: 100%; height: 100%; object-fit: cover; }

        .brand-text { min-width: 0; }

        .brand-text h1 {
            font-family: 'Anybody', cursive;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-text p {
            font-family: 'Space Grotesk', monospace;
            font-size: 0.7rem;
            color: #5D6E5A;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .action-icons { display: flex; gap: 15px; align-items: center; flex-shrink: 0; }

        .icon-btn {
            background: var(--gray-soft);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 40px;
            font-size: 1.4rem;
            cursor: pointer;
            transition: background var(--transition-fast), transform var(--transition-fast);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .icon-btn:hover { background: #E9E2D4; transform: scale(0.96); }
        .icon-btn:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }

        .cart-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--tertiary);
            color: white;
            font-size: 0.7rem;
            font-weight: bold;
            width: 22px;
            height: 22px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Space Grotesk', monospace;
            transition: transform var(--transition-fast);
        }

        .cart-badge.pulse { animation: badgePulse 0.35s ease; }
        @keyframes badgePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }

        /* ── Categories bar ── */
        .categories-bar {
            position: fixed;
            bottom: 12px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            pointer-events: none;
            z-index: 25;
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .categories-scroll {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border: 1px solid rgba(241, 136, 37, 0.3);
            padding: 10px 18px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 12px;
            max-width: 95%;
            width: auto;
            margin: 0 16px;
            pointer-events: auto;
            transition: all var(--transition-fast);
            overflow-x: visible;
            scrollbar-width: none;
        }

        .categories-scroll::-webkit-scrollbar { display: none; }

        .cat-bottom-item {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            background: var(--neutral);
            padding: 6px 16px;
            border-radius: 50px;
            gap: 4px;
            cursor: pointer;
            transition: all var(--transition-fast);
            border: 1px solid #F0DFC8;
            font-family: 'Space Grotesk', monospace;
            font-weight: 600;
            font-size: 0.75rem;
            white-space: nowrap;
            user-select: none;
        }

        .cat-bottom-item i { font-size: 1rem; color: var(--secondary); }
        .cat-bottom-item:hover { border-color: var(--secondary); }

        .cat-bottom-item.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(46, 107, 67, 0.2);
        }

        .cat-bottom-item.active i { color: white; }

        /* ── Menu grid ── */
        .menu-container {
            max-width: 1300px;
            margin: 25px auto 15px;
            padding: 0 20px 20px;
            min-height: 400px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 26px;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .menu-grid.fade-out {
            opacity: 0;
            transform: translateY(8px);
            pointer-events: none;
        }

        .menu-grid.fade-in {
            animation: gridFadeIn 0.35s ease forwards;
        }

        @keyframes gridFadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .menu-card {
            background: var(--neutral);
            border-radius: 32px;
            overflow: hidden;
            transition: transform var(--transition-base), box-shadow var(--transition-base), opacity 0.4s ease;
            box-shadow: var(--shadow-sm);
            border: 1px solid #FBEAD4;
            display: flex;
            flex-direction: column;
            contain: layout style;
            opacity: 0;
            animation: cardFadeIn 0.4s ease forwards;
        }

        @keyframes cardFadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .menu-card:nth-child(1) { animation-delay: 0.02s; }
        .menu-card:nth-child(2) { animation-delay: 0.06s; }
        .menu-card:nth-child(3) { animation-delay: 0.10s; }
        .menu-card:nth-child(4) { animation-delay: 0.14s; }
        .menu-card:nth-child(5) { animation-delay: 0.18s; }
        .menu-card:nth-child(6) { animation-delay: 0.22s; }
        .menu-card:nth-child(7) { animation-delay: 0.26s; }
        .menu-card:nth-child(8) { animation-delay: 0.30s; }

        .menu-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-md); }
        .menu-card:focus-within { outline: 3px solid var(--secondary); outline-offset: 2px; }

        .card-img {
            height: 180px;
            overflow: hidden;
            background: #F3E9DC;
            position: relative;
        }

        .card-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease, opacity 0.4s ease, filter 0.4s ease;
            opacity: 0;
            filter: blur(8px);
        }

        .card-img img.is-loaded {
            opacity: 1;
            filter: blur(0);
        }

        .menu-card:hover .card-img img { transform: scale(1.05); }

        .card-info {
            padding: 16px 14px 18px;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .item-title {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            gap: 8px;
            font-weight: 700;
            font-size: 1.2rem;
            font-family: 'Anybody', cursive;
        }

        .item-title span:first-child { overflow-wrap: anywhere; }

        .item-price {
            color: var(--secondary);
            font-weight: 800;
            font-size: 1.2rem;
            font-family: 'Space Grotesk', monospace;
            white-space: nowrap;
        }

        .item-desc {
            font-size: 0.75rem;
            color: #716C5F;
            margin: 6px 0 12px;
            flex: 1;
        }

        /* ── Card action: Add button ↔ qty stepper ── */
        .card-action {
            position: relative;
            min-height: 38px;
        }

        .add-to-cart {
            background: var(--primary);
            border: none;
            width: 100%;
            padding: 9px;
            border-radius: 40px;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-weight: 600;
            font-size: 0.95rem;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: background var(--transition-fast), gap var(--transition-fast), transform var(--transition-fast);
        }

        .add-to-cart:hover { background: var(--primary-dark); gap: 12px; }
        .add-to-cart:active { transform: scale(0.97); }
        .add-to-cart:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }

        .qty-stepper {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: var(--primary);
            border-radius: 40px;
            padding: 4px;
            gap: 6px;
            animation: stepperIn 0.25s ease;
            box-shadow: 0 4px 10px rgba(46, 107, 67, 0.25);
        }

        @keyframes stepperIn {
            from { opacity: 0; transform: scale(0.92); }
            to   { opacity: 1; transform: scale(1); }
        }

        .qty-stepper.show { display: flex; }
        .add-to-cart.hide { display: none; }

        .stepper-btn {
            background: rgba(255, 255, 255, 0.18);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background var(--transition-fast), transform var(--transition-fast);
            flex-shrink: 0;
            line-height: 1;
        }

        .stepper-btn:hover { background: rgba(255, 255, 255, 0.32); }
        .stepper-btn:active { transform: scale(0.9); }
        .stepper-btn:focus-visible { outline: 2px solid white; outline-offset: 1px; }

        .stepper-btn.trash {
            background: rgba(255, 255, 255, 0.12);
            font-size: 0.85rem;
        }

        .stepper-btn.trash:hover { background: rgba(211, 47, 47, 0.85); }

        .stepper-qty {
            color: white;
            font-family: 'Space Grotesk', monospace;
            font-weight: 700;
            font-size: 1rem;
            min-width: 28px;
            text-align: center;
            user-select: none;
            transition: transform var(--transition-fast);
        }

        .stepper-qty.bump { animation: qtyBump 0.25s ease; }

        @keyframes qtyBump {
            0%   { transform: scale(1); }
            50%  { transform: scale(1.3); }
            100% { transform: scale(1); }
        }

        /* ── Footer ── */
        .footer-section {
            max-width: 1300px;
            margin: 10px auto 20px;
            padding: 0 20px 15px;
            text-align: center;
            font-family: 'Space Grotesk', monospace;
            font-size: 0.8rem;
            color: #5D6E5A;
        }

        .footer-line {
            border: none;
            height: 1px;
            background: linear-gradient(to right, transparent, #F0DFC8, #F0DFC8, transparent);
            margin-bottom: 15px;
        }

        .developer-credit {
            direction: ltr;
            unicode-bidi: embed;
            display: inline-block;
            width: 100%;
        }

        .developer-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color var(--transition-fast);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .developer-link:hover { color: var(--secondary); text-decoration: underline; }

        /* ── Cart modal ── */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 16px;
        }

        .modal[aria-hidden="false"] { display: flex; }

        .modal-card {
            background: white;
            width: 100%;
            max-width: 550px;
            border-radius: 48px;
            padding: 22px;
            max-height: 90vh;
            overflow-y: auto;
            direction: rtl;
            animation: modalIn 0.2s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(20px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #F3D9B4;
            padding-bottom: 12px;
            font-family: 'Anybody', cursive;
            font-weight: 700;
            font-size: 1.4rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .modal-header-actions { display: flex; gap: 8px; align-items: center; }

        .delete-all-btn {
            background: #fce4e4;
            border: none;
            border-radius: 50px;
            padding: 6px 14px;
            font-size: 0.8rem;
            font-weight: bold;
            color: var(--tertiary);
            cursor: pointer;
            transition: background var(--transition-fast), transform var(--transition-fast);
        }

        .delete-all-btn:hover { background: #ffd1d1; transform: scale(0.96); }

        .cart-items-list {
            margin: 16px 0;
            max-height: 45vh;
            overflow-y: auto;
        }

        .cart-item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #F0E2D0;
            flex-wrap: wrap;
            gap: 8px;
        }

        .cart-item-info {
            display: flex;
            gap: 12px;
            align-items: center;
            flex: 2;
            min-width: 140px;
        }

        .cart-item-img {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            object-fit: cover;
            flex-shrink: 0;
            background: #F3E9DC;
        }

        .qty-control { display: flex; gap: 8px; align-items: center; flex-wrap: nowrap; }

        .qty-btn {
            background: #F3E5D2;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 30px;
            font-weight: bold;
            cursor: pointer;
            transition: background var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            flex-shrink: 0;
        }

        .qty-btn:hover { background: #e6d3b8; }
        .qty-btn.remove-item { background: #f3cfb5; }
        .qty-btn.remove-item:hover { background: #eab696; }

        .cart-summary {
            border-top: 2px solid var(--secondary);
            padding-top: 12px;
            margin-top: 8px;
        }

        .cart-summary-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            color: #5D6E5A;
            margin-bottom: 6px;
            font-family: 'Space Grotesk', monospace;
        }

        .cart-total {
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .cart-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

        .close-modal-btn {
            background: var(--tertiary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            min-width: 100px;
            font-size: 1rem;
            transition: opacity var(--transition-fast);
        }

        .close-modal-btn:hover { opacity: 0.9; }

        .checkout-btn {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 40px;
            font-weight: bold;
            cursor: pointer;
            flex: 1.5;
            min-width: 140px;
            font-size: 1rem;
            transition: background var(--transition-fast), transform var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .checkout-btn:hover { background: #d9771e; transform: scale(0.98); }
        .checkout-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

        .empty-msg {
            text-align: center;
            padding: 30px 10px;
            font-family: 'Space Grotesk', monospace;
            color: #AA9C86;
            grid-column: 1 / -1;
        }

        /* ── Branches panel ── */
        .branches-panel {
            position: fixed;
            bottom: 95px;
            right: 20px;
            left: 20px;
            margin: 0 auto;
            background: white;
            border-radius: 28px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
            width: 280px;
            max-width: calc(100% - 40px);
            z-index: 45;
            padding: 16px;
            display: none;
            border-right: 5px solid var(--secondary);
        }

        .branches-panel.show { display: block; animation: fadeSlide 0.2s ease; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .branch-option {
            padding: 10px;
            border-bottom: 1px solid #F3E2CE;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            transition: background var(--transition-fast);
        }

        .branch-option:last-child { border-bottom: none; }
        .branch-option:hover { background: #FEF5E8; border-radius: 20px; }

        /* ── Responsive ── */
        @media (max-width: 680px) {
            .brand-text h1 { font-size: 1.1rem; max-width: 45vw; }
            .logo-img { width: 42px; height: 42px; }
            .icon-btn { width: 40px; height: 40px; font-size: 1.2rem; }
            .categories-scroll {
                flex-wrap: nowrap;
                overflow-x: auto;
                justify-content: flex-start;
                -webkit-overflow-scrolling: touch;
                scrollbar-width: none;
                gap: 10px;
                padding: 8px 16px;
                border-radius: 44px;
                max-width: 94%;
                margin: 0 12px;
            }
            .cat-bottom-item {
                padding: 6px 14px;
                font-size: 0.7rem;
                white-space: nowrap;
                flex-shrink: 0;
            }
            .menu-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
            .card-img { height: 150px; }
            .item-title { font-size: 1rem; }
            .modal-card { padding: 16px; border-radius: 32px; }
            .cart-item-row { font-size: 0.9rem; }
            .checkout-btn { font-size: 0.9rem; padding: 10px 14px; }
            .branches-panel { bottom: 88px; }
        }

        @media (max-width: 480px) {
            .header-container { padding: 8px 14px; }
            .categories-scroll { padding: 6px 14px; gap: 8px; border-radius: 40px; }
            .cat-bottom-item { padding: 4px 12px; font-size: 0.65rem; }
            .cat-bottom-item i { font-size: 0.85rem; }
            .menu-container { padding: 0 12px 20px; }
            .menu-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
            .card-img { height: 110px; }
            .card-info { padding: 10px 10px 12px; }
            .item-title { font-size: 0.85rem; flex-direction: column; align-items: flex-start; gap: 2px; }
            .item-price { font-size: 0.95rem; }
            .item-desc { font-size: 0.68rem; margin: 4px 0 8px; }
            .add-to-cart { font-size: 0.75rem; padding: 8px; }
            .stepper-btn { width: 28px; height: 28px; font-size: 1rem; }
            .stepper-qty { font-size: 0.9rem; min-width: 22px; }
        }

        @media (max-width: 340px) {
            .menu-grid { grid-template-columns: 1fr; }
        }

        /* ── SweetAlert2 overrides ── */
        .swal2-popup.swal2-modal {
            font-family: 'Be Vietnam Pro', sans-serif;
            border-radius: 32px;
            padding: 1.5rem;
            width: 92% !important;
            max-width: 480px;
        }

        .swal2-popup .swal2-title {
            font-family: 'Anybody', cursive;
            color: var(--primary);
            font-size: 1.3rem;
        }

        .swal2-popup .swal2-html-container { font-size: 0.95rem; color: #2d3d34; }

        .checkout-form-group { text-align: right; margin-bottom: 14px; }

        .checkout-form-group label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #2d3d34;
        }

        .checkout-form-group input,
        .checkout-form-group textarea {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #E8DDD0;
            border-radius: 16px;
            font-size: 0.95rem;
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #FDFBF7;
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
            outline: none;
            text-align: right;
        }

    <script>
    'use strict';

    // ═══════════════════════════════════════════════════════════
    //  CONFIG
    // ═══════════════════════════════════════════════════════════
    const CONFIG = Object.freeze({
        STORAGE_KEY: 'koshary_cart_v2',
        DELIVERY_FEE: 10,
        CURRENCY: 'ج.م',
        IMAGES_PATH: 'images/',
        DEFAULT_IMAGE: 'default.jpg',
        LOGO_IMAGE: 'logo.jpg',
        DEFAULT_BRANCH: 'sanaa',                    // 👈 تم التعديل: صنعاء
        BRANCH_PHONES: {
            'sanaa': '201060524239',
            'el-nabawy': '201013706142'
        },
        BRANCH_NAMES: {
            'sanaa': 'فرع صنعاء – سور حديقة',
            'el-nabawy': ' شارع النبوّي المهندس'
        }
    });

    const IMG = {
        path: (file) => `${CONFIG.IMAGES_PATH}${file}`,
        fallback: () => `${CONFIG.IMAGES_PATH}${CONFIG.DEFAULT_IMAGE}`,
        logo: () => `${CONFIG.IMAGES_PATH}${CONFIG.LOGO_IMAGE}`
    };

    // ═══════════════════════════════════════════════════════════
    //  MENU CATALOG
    // ═══════════════════════════════════════════════════════════
    const MENU_CATALOG = {

        //1 ===> Done
        'تيك واي': [
            { name: ' شبح',    price: 25, desc: 'طبق تيك واي مميز',        img: 'super-shabh.jpeg' },
            { name: 'سوبر شبح',    price: 30, desc: 'طبق تيك واي مميز',    img: 'super-shabh.jpeg' },
            { name: 'سوبر الزعيم', price: 40, desc: 'طبق تيك واي خاص',     img: 'super-zaeem.jpg' },
            { name: 'محمد ومالك',  price: 50, desc: 'طبق تيك واي عائلي',   img: 'mohamed-malek.jpg' },
            { name: 'طبق (z)',     price: 60, desc: 'طبق تيك واي زد',      img: 'dish-z.jpg' },
            { name: 'ابو مالك',    price: 70, desc: 'طبق تيك واي كبير',    img: 'abu-malek.jpg' }
        ],

        //2 ===> Done
        'طواجن': [
            { name: 'لحمه',  price: 35, desc: 'طاجن لحم',  img: 'tagen-lahma.jpg' },
            { name: 'فراخ',  price: 40, desc: 'طاجن فراخ', img: 'tagen-firakh.jpg' }
        ],

       //3 ===> Done
        'طواجن موزريلا': [
            { name: 'لحمه موزيلا',       price: 55,  desc: 'طاجن لحم مع موزريلا',       img: 'tagen-mozzarella-lahma.jpg' },
            { name: 'فراخ موزيلا',       price: 60,  desc: 'طاجن فراخ مع موزريلا',      img: 'tagen-mozzarella-firakh.jpg' },
            { name: 'لحمه موزيلا كبير',  price: 110, desc: 'طاجن لحم كبير مع موزريلا',  img: 'tagen-mozzarella-lahma-kbeer.jpg' },
            { name: 'فراخ موزيلا كبير',  price: 120, desc: 'طاجن فراخ كبير مع موزريلا', img: 'tagen-mozzarella-firakh-kbeer.jpg' }
        ],
        'طواجن دوبل وميكس': [
            { name: 'لحمه كبير',  price: 70, desc: 'طاجن لحم كبير',  img: 'tagen-double-lahma-kbeer.jpg' },
            { name: 'فراخ كبير',  price: 80, desc: 'طاجن فراخ كبير', img: 'tagen-double-firakh-kbeer.jpg' },
            { name: 'فراخ ميكس',  price: 55, desc: 'طاجن فراخ ميكس', img: 'tagen-mix-firakh.jpg' },
            { name: 'لحمه ميكس',  price: 50, desc: 'طاجن لحم ميكس',  img: 'tagen-mix-lahma.jpg' }
        ],
        'الاضافات': [
            { name: 'إضافة موزيلا', price: 20, desc: 'إضافة موزيلا', img: 'mozzarella.png' },
            { name: 'إضافة حمص',    price: 10, desc: 'إضافة حمص',    img: 'extra-homos.jpg' },
            { name: 'إضافة صلصة',   price: 10, desc: 'إضافة صلصة',   img: 'extra-salsa.jpg' },
            { name: 'إضافة تقليه',  price: 10, desc: 'إضافة تقليه',  img: 'extra-taglia.jpg' },
            { name: 'إضافة عدس',    price: 10, desc: 'إضافة عدس',    img: 'extra-lentils.jpg' },
            { name: 'إضافة توست',   price: 10, desc: 'إضافة توست',   img: 'extra-toast.png' },
            { name: 'إضافة خضراء',  price: 10, desc: 'سلطة خضراء',  img: 'salata.png' }
        ],
        'الحلو': [
            { name: 'أرز بلبن فرن', price: 15, desc: 'أرز بلبن بالفرن',  img: 'dessert-rice-pudding.png' },
            { name: 'قشطة',         price: 5,  desc: 'قشطة طازجة',       img: 'dessert-cream.jpg' },
            { name: 'عسل',          price: 5,  desc: 'عسل نحل أصلي',     img: 'dessert-honey.jpg' },
            { name: 'مكسرات',       price: 5,  desc: 'مكسرات مشكلة',     img: 'dessert-nuts.jpg' }
        ],
        'المشروبات': [
            { name: 'كانز',        price: 15, desc: ' كانز',   img: 'drink-can.jpg' },
            { name: 'مياة صغيره',  price: 6,  desc: 'مياة صغيرة',   img: 'drink-water-small.jpg' },
            { name: 'مياة كبيرة',  price: 10, desc: 'مياة كبيرة',   img: 'drink-water-large.jpg' }
        ]
    };

    const CATEGORY_LIST = Object.keys(MENU_CATALOG);

    const CATEGORY_ICON_MAP = {
        'تيك واي': 'fa-bag-shopping',
        'طواجن': 'fa-fire',
        'طواجن موزريلا': 'fa-cheese',
        'طواجن دوبل وميكس': 'fa-layer-group',
        'الاضافات': 'fa-plus-circle',
        'الحلو': 'fa-cake-candles',
        'المشروبات': 'fa-mug-hot'
    };

    // ═══════════════════════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════════════════════
    let activeCategory = CATEGORY_LIST[0];
    let cart = [];
    let isTransitioning = false;

    // ═══════════════════════════════════════════════════════════
    //  DOM REFS
    // ═══════════════════════════════════════════════════════════
    const $ = (sel, ctx = document) => ctx.querySelector(sel);
    const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));

    const dom = {
        cartBadge:        $('#cartBadge'),
        cartModal:        $('#cartModal'),
        cartItemsList:    $('#cartItemsList'),
        cartSummary:      $('#cartSummary'),
        checkoutBtn:      $('#checkoutBtn'),
        modalCloseFooter: $('#modalCloseFooter'),
        deleteAllBtn:     $('#deleteAllCartBtn'),
        cartIconBtn:      $('#cartIconBtn'),
        locationBtn:      $('#locationIconBtn'),
        branchesPanel:    $('#branchesPanel'),
        menuGrid:         $('#menuGrid'),
        bottomCategories: $('#bottomCategories'),
        brandLogoImg:     $('#brandLogoImg'),
        menuContainer:    $('.menu-container')
    };

    // ═══════════════════════════════════════════════════════════
    //  UTILITIES
    // ═══════════════════════════════════════════════════════════
    function escapeHtml(str) {
        return String(str ?? '')
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/`/g, '&#96;');
    }

    function formatPrice(n) {
        return `${Number(n).toFixed(2)} ${CONFIG.CURRENCY}`;
    }

    function generateId(name, category) {
        return `${category}__${name.replace(/\s+/g, '_')}`;
    }

    function getTotal() {
        return cart.reduce((sum, i) => sum + i.price * i.quantity, 0);
    }

    function getItemCount() {
        return cart.reduce((sum, i) => sum + i.quantity, 0);
    }

    function findCartItem(id) {
        return cart.find(i => i.id === id) || null;
    }

    function isValidCartItem(item) {
        return item && typeof item === 'object'
            && typeof item.id === 'string'
            && typeof item.name === 'string'
            && typeof item.price === 'number' && item.price >= 0
            && typeof item.quantity === 'number' && item.quantity > 0
            && typeof item.category === 'string';
    }

    // ═══════════════════════════════════════════════════════════
    //  LAZY IMAGE OBSERVER
    // ═══════════════════════════════════════════════════════════
    const imageObserver = ('IntersectionObserver' in window)
        ? new IntersectionObserver((entries, obs) => {
            entries.forEach(entry => {
                if (!entry.isIntersecting) return;
                const img = entry.target;
                if (img.dataset.src && (!img.src || img.src.startsWith('data:'))) {
                    img.src = img.dataset.src;
                }
                obs.unobserve(img);
            });
        }, { rootMargin: '200px 0px' })
        : null;

    function attachImage(img) {
        if (img.complete && img.naturalWidth > 0) {
            img.classList.add('is-loaded');
        } else {
            img.addEventListener('load', () => img.classList.add('is-loaded'), { once: true });
            img.addEventListener('error', () => {
                if (img.src !== IMG.fallback() && !img.src.endsWith(CONFIG.DEFAULT_IMAGE)) {
                    img.src = IMG.fallback();
                } else {
                    img.classList.add('is-loaded');
                }
            }, { once: true });
        }
        if (imageObserver) imageObserver.observe(img);
        else if (img.dataset.src && (!img.src || img.src.startsWith('data:'))) img.src = img.dataset.src;
    }

    // ═══════════════════════════════════════════════════════════
    //  STORAGE
    // ═══════════════════════════════════════════════════════════
    const storage = {
        save() {
            try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(cart)); }
            catch (e) { console.warn('Cart save failed:', e); }
        },
        load() {
            try {
                const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
                if (!raw) return;
                const parsed = JSON.parse(raw);
                if (Array.isArray(parsed)) cart = parsed.filter(isValidCartItem);
            } catch (e) {
                console.warn('Cart load failed:', e);
                cart = [];
            }
        }
    };

    // ═══════════════════════════════════════════════════════════
    //  CART LOGIC
    // ═══════════════════════════════════════════════════════════
    function updateCartUI() {
        const count = getItemCount();
        const prev = parseInt(dom.cartBadge.textContent, 10) || 0;

        dom.cartBadge.textContent = count;
        if (count > prev) {
            dom.cartBadge.classList.remove('pulse');
            void dom.cartBadge.offsetWidth;
            dom.cartBadge.classList.add('pulse');
        }
        dom.checkoutBtn.disabled = cart.length === 0;
        storage.save();
    }

    function bumpQty(el) {
        if (!el) return;
        el.classList.remove('bump');
        void el.offsetWidth;
        el.classList.add('bump');
    }

    function addItemToCart(name, price, img, category) {
        const id = generateId(name, category);
        const existing = findCartItem(id);
        if (existing) existing.quantity += 1;
        else cart.push({ id, name, price, img, quantity: 1, category });

        updateCartUI();
        syncCardAction(id, { bump: true });
    }

    function incrementItem(id) {
        const item = findCartItem(id);
        if (!item) return;
        item.quantity += 1;
        updateCartUI();
        syncCardAction(id, { bump: true });
        if (isCartModalOpen()) renderCartModalContent();
    }

    function decrementItem(id) {
        const item = findCartItem(id);
        if (!item) return;
        item.quantity -= 1;
        if (item.quantity <= 0) {
            removeItemById(id);
            return;
        }
        updateCartUI();
        syncCardAction(id, { bump: true });
        if (isCartModalOpen()) renderCartModalContent();
    }

    function removeItemById(id) {
        const idx = cart.findIndex(i => i.id === id);
        if (idx === -1) return;
        cart.splice(idx, 1);
        updateCartUI();
        syncCardAction(id);
        if (isCartModalOpen()) renderCartModalContent();
    }

    function syncCardAction(id, opts = {}) {
        const card = dom.menuGrid.querySelector(`.menu-card[data-item-id="${CSS.escape(id)}"]`);
        if (!card) return;

        const addBtn   = card.querySelector('.add-to-cart');
        const stepper  = card.querySelector('.qty-stepper');
        const qtySpan  = card.querySelector('.stepper-qty');
        const item     = findCartItem(id);
        const qty      = item ? item.quantity : 0;

        if (qty > 0) {
            addBtn.classList.add('hide');
            stepper.classList.add('show');
            if (qtySpan) {
                if (qtySpan.textContent !== String(qty)) {
                    qtySpan.textContent = qty;
                    if (opts.bump) bumpQty(qtySpan);
                }
            }
        } else {
            stepper.classList.remove('show');
            addBtn.classList.remove('hide');
        }
    }

    function syncAllCardActions() {
        $$('.menu-card[data-item-id]', dom.menuGrid).forEach(card => {
            syncCardAction(card.dataset.itemId);
        });
    }

    function isCartModalOpen() {
        return dom.cartModal.getAttribute('aria-hidden') === 'false';
    }

    function emptyCartWithConfirm() {
        if (cart.length === 0) {
            Swal.fire('السلة فارغة', 'لا توجد أطباق لحذفها', 'info');
            return;
        }
        Swal.fire({
            title: 'هل أنت متأكد؟',
            text: 'سيتم إفراغ سلة الطلبات بالكامل!',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#D32F2F',
            cancelButtonColor: '#2E6B43',
            confirmButtonText: 'نعم، إفراغ السلة',
            cancelButtonText: 'إلغاء'
        }).then(result => {
            if (result.isConfirmed) {
                cart = [];
                updateCartUI();
                renderCartModalContent();
                syncAllCardActions();
                Swal.fire('تم الإفراغ', 'أصبحت السلة فارغة', 'success');
            }
        });
    }

    // ═══════════════════════════════════════════════════════════
    //  RENDER — CATEGORIES
    // ═══════════════════════════════════════════════════════════
    function renderBottomCategories() {
        dom.bottomCategories.innerHTML = CATEGORY_LIST.map(cat => `
            <button type="button"
                    class="cat-bottom-item ${activeCategory === cat ? 'active' : ''}"
                    data-category="${escapeHtml(cat)}"
                    aria-pressed="${activeCategory === cat}">
                <i class="fas ${CATEGORY_ICON_MAP[cat] || 'fa-utensils'}" aria-hidden="true"></i>
                <span>${escapeHtml(cat)}</span>
            </button>
        `).join('');
    }

    function setActiveCategory(cat) {
        if (cat === activeCategory || isTransitioning) return;
        isTransitioning = true;
        activeCategory = cat;

        $$('.cat-bottom-item', dom.bottomCategories).forEach(btn => {
            const isActive = btn.dataset.category === cat;
            btn.classList.toggle('active', isActive);
            btn.setAttribute('aria-pressed', String(isActive));
        });

        const activeBtn = $(`.cat-bottom-item[data-category="${CSS.escape(cat)}"]`, dom.bottomCategories);
        if (activeBtn) activeBtn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });

        dom.menuGrid.classList.remove('fade-in');
        dom.menuGrid.classList.add('fade-out');

        const onFadeOut = () => {
            dom.menuGrid.removeEventListener('transitionend', onFadeOut);
            renderMenuGrid();
            void dom.menuGrid.offsetWidth;
            dom.menuGrid.classList.remove('fade-out');
            dom.menuGrid.classList.add('fade-in');
            dom.menuContainer?.scrollIntoView({ behavior: 'smooth', block: 'start' });

            setTimeout(() => {
                dom.menuGrid.classList.remove('fade-in');
                isTransitioning = false;
            }, 400);
        };

        dom.menuGrid.addEventListener('transitionend', onFadeOut, { once: true });
        setTimeout(() => { if (isTransitioning) onFadeOut(); }, 280);
    }

    // ═══════════════════════════════════════════════════════════
    //  RENDER — MENU GRID
    // ═══════════════════════════════════════════════════════════
    function renderMenuGrid() {
        const items = MENU_CATALOG[activeCategory] || [];
        if (!items.length) {
            dom.menuGrid.innerHTML = `<div class="empty-msg">✨ لا توجد أطباق حالياً ✨</div>`;
            return;
        }

        dom.menuGrid.innerHTML = items.map(item => {
            const imgPath = IMG.path(item.img);
            const id = generateId(item.name, activeCategory);
            const cartItem = findCartItem(id);
            const qty = cartItem ? cartItem.quantity : 0;
            const showStepper = qty > 0;

            return `
            <article class="menu-card" data-item-id="${escapeHtml(id)}">
                <div class="card-img">
                    <img data-src="${escapeHtml(imgPath)}"
                         src="data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='4' height='3' viewBox='0 0 4 3'%3E%3Crect width='4' height='3' fill='%23F3E9DC'/%3E%3C/svg%3E"
                         alt="${escapeHtml(item.name)}"
                         loading="lazy"
                         decoding="async">
                </div>
                <div class="card-info">
                    <div class="item-title">
                        <span>${escapeHtml(item.name)}</span>
                        <span class="item-price">${formatPrice(item.price)}</span>
                    </div>
                    <div class="item-desc">${escapeHtml(item.desc || 'طبق مميز من كشري الزعيم')}</div>

                    <div class="card-action">
                        <button type="button"
                                class="add-to-cart ${showStepper ? 'hide' : ''}"
                                data-name="${escapeHtml(item.name)}"
                                data-price="${item.price}"
                                data-img="${escapeHtml(imgPath)}"
                                data-cat="${escapeHtml(activeCategory)}">
                            <i class="fas fa-cart-plus" aria-hidden="true"></i>
                            <span class="btn-label">أضف للطلب</span>
                        </button>

                        <div class="qty-stepper ${showStepper ? 'show' : ''}"
                             data-item-id="${escapeHtml(id)}"
                             role="group"
                             aria-label="الكمية">
                            <button type="button"
                                    class="stepper-btn trash"
                                    data-action="remove"
                                    data-item-id="${escapeHtml(id)}"
                                    aria-label="حذف العنصر">
                                <i class="fas fa-trash-alt" aria-hidden="true"></i>
                            </button>
                            <button type="button"
                                    class="stepper-btn decr"
                                    data-action="decr"
                                    data-item-id="${escapeHtml(id)}"
                                    aria-label="تقليل الكمية">−</button>
                            <span class="stepper-qty" aria-live="polite">${qty || 1}</span>
                            <button type="button"
                                    class="stepper-btn incr"
                                    data-action="incr"
                                    data-item-id="${escapeHtml(id)}"
                                    aria-label="زيادة الكمية">+</button>
                        </div>
                    </div>
                </div>
            </article>
        `;
        }).join('');

        $$('img[data-src]', dom.menuGrid).forEach(attachImage);
    }

    // ═══════════════════════════════════════════════════════════
    //  RENDER — CART
    // ═══════════════════════════════════════════════════════════
    function renderCartModalContent() {
        if (cart.length === 0) {
            dom.cartItemsList.innerHTML = `<div class="empty-msg">السلة فارغة، أضف أشهى الأطباق 🍽️</div>`;
            dom.cartSummary.innerHTML = '';
            dom.checkoutBtn.disabled = true;
            return;
        }
        dom.checkoutBtn.disabled = false;

        dom.cartItemsList.innerHTML = cart.map((item, idx) => `
            <div class="cart-item-row" data-idx="${idx}">
                <div class="cart-item-info">
                    <img src="${escapeHtml(item.img)}"
                         class="cart-item-img"
                         alt=""
                         loading="lazy"
                         decoding="async"
                         onerror="this.onerror=null;this.src='${IMG.fallback()}'">
                    <div>
                        <strong>${escapeHtml(item.name)}</strong><br>
                        <small>${formatPrice(item.price)}</small>
                    </div>
                </div>
                <div class="qty-control">
                    <button type="button" class="qty-btn decr-item" data-idx="${idx}" aria-label="تقليل الكمية">−</button>
                    <span aria-live="polite">${item.quantity}</span>
                    <button type="button" class="qty-btn incr-item" data-idx="${idx}" aria-label="زيادة الكمية">+</button>
                    <button type="button" class="qty-btn remove-item" data-idx="${idx}" aria-label="حذف العنصر">
                        <i class="fas fa-trash-alt" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="item-line-total">${formatPrice(item.price * item.quantity)}</div>
            </div>
        `).join('');

        updateCartSummary();
    }

    function updateCartSummary() {
        const subtotal = getTotal();
        const grandTotal = subtotal + CONFIG.DELIVERY_FEE;
        dom.cartSummary.innerHTML = `
            <div class="cart-summary-row"><span>المجموع الفرعي</span><span>${formatPrice(subtotal)}</span></div>
            <div class="cart-summary-row"><span>رسوم التوصيل (تقديرية)</span><span>${formatPrice(CONFIG.DELIVERY_FEE)}</span></div>
            <div class="cart-total"><span>الإجمالي</span><span>${formatPrice(grandTotal)}</span></div>
        `;
    }

    function updateCartRow(idx) {
        const row = dom.cartItemsList.querySelector(`.cart-item-row[data-idx="${idx}"]`);
        if (!row) return;
        const item = cart[idx];
        row.querySelector('.qty-control span').textContent = item.quantity;
        row.querySelector('.item-line-total').textContent = formatPrice(item.price * item.quantity);
        updateCartSummary();
    }

    // ═══════════════════════════════════════════════════════════
    //  EVENT DELEGATION — CART MODAL qty
    // ═══════════════════════════════════════════════════════════
    dom.cartItemsList.addEventListener('click', (e) => {
        const btn = e.target.closest('button');
        if (!btn) return;
        const idx = parseInt(btn.dataset.idx, 10);
        if (isNaN(idx) || !cart[idx]) return;
        const item = cart[idx];

        if (btn.classList.contains('incr-item')) {
            item.quantity += 1;
            updateCartRow(idx);
            updateCartUI();
            syncCardAction(item.id, { bump: true });
        } else if (btn.classList.contains('decr-item')) {
            if (item.quantity > 1) {
                item.quantity -= 1;
                updateCartRow(idx);
                updateCartUI();
                syncCardAction(item.id, { bump: true });
            } else {
                const id = item.id;
                cart.splice(idx, 1);
                updateCartUI();
                renderCartModalContent();
                syncCardAction(id);
            }
        } else if (btn.classList.contains('remove-item')) {
            const id = item.id;
            cart.splice(idx, 1);
            updateCartUI();
            renderCartModalContent();
            syncCardAction(id);
        }
    });

    // ═══════════════════════════════════════════════════════════
    //  EVENT DELEGATION — MENU GRID (add + stepper buttons)
    // ═══════════════════════════════════════════════════════════
    dom.menuGrid.addEventListener('click', (e) => {
        const addBtn = e.target.closest('.add-to-cart');
        if (addBtn) {
            addItemToCart(
                addBtn.dataset.name,
                parseFloat(addBtn.dataset.price),
                addBtn.dataset.img,
                addBtn.dataset.cat
            );
            return;
        }

        const stepBtn = e.target.closest('.stepper-btn');
        if (stepBtn) {
            const itemId = stepBtn.dataset.itemId;
            const action = stepBtn.dataset.action;
            if (action === 'incr') incrementItem(itemId);
            else if (action === 'decr') decrementItem(itemId);
            else if (action === 'remove') removeItemById(itemId);
        }
    });

    // ═══════════════════════════════════════════════════════════
    //  EVENT DELEGATION — CATEGORIES
    // ═══════════════════════════════════════════════════════════
    dom.bottomCategories.addEventListener('click', (e) => {
        const btn = e.target.closest('.cat-bottom-item');
        if (btn) setActiveCategory(btn.dataset.category);
    });

    // ═══════════════════════════════════════════════════════════
    //  CHECKOUT FLOW
    // ═══════════════════════════════════════════════════════════
    function startCheckout() {
        if (cart.length === 0) {
            Swal.fire('السلة فارغة', 'أضف أطباقاً أولاً ثم أتمم الطلب.', 'info');
            return;
        }
        showCustomerForm(CONFIG.DEFAULT_BRANCH);
    }

    function showCustomerForm(branchKey, prefill = {}) {
        Swal.fire({
            title: '📝 بيانات التوصيل',
            html: `
                <div style="text-align:right;">
                    <div class="checkout-form-group">
                        <label for="custName"><i class="fas fa-user"></i> الاسم الكامل</label>
                        <input type="text" id="custName" placeholder="أدخل اسمك" value="${escapeHtml(prefill.name || '')}" autocomplete="name" />
                    </div>
                    <div class="checkout-form-group">
                        <label for="custPhone"><i class="fas fa-phone"></i> رقم الجوال</label>
                        <input type="tel" id="custPhone" placeholder="مثال: 01012345678" value="${escapeHtml(prefill.phone || '')}" autocomplete="tel" inputmode="tel" />
                    </div>
                    <div class="checkout-form-group">
                        <label for="custAddress"><i class="fas fa-map-pin"></i> عنوان التوصيل</label>
                        <textarea id="custAddress" rows="2" placeholder="اكتب عنوانك بالتفصيل" autocomplete="street-address">${escapeHtml(prefill.address || '')}</textarea>
                    </div>
                    <div style="font-size:0.8rem;color:#8a7a6a;text-align:center;margin-top:4px;">
                        🏪 الفرع: <strong>${CONFIG.BRANCH_NAMES[branchKey]}</strong>
                    </div>
                </div>
            `,
            showCancelButton: true,
            cancelButtonText: 'إلغاء',
            cancelButtonColor: '#8a7a6a',
            confirmButtonText: 'مراجعة الطلب ➜',
            confirmButtonColor: '#2E6B43',
            allowOutsideClick: false,
            preConfirm: () => {
                const name = document.getElementById('custName')?.value?.trim();
                const phone = document.getElementById('custPhone')?.value?.trim();
                const address = document.getElementById('custAddress')?.value?.trim();
                if (!name) { Swal.showValidationMessage('يرجى إدخال الاسم'); return false; }
                if (!phone) { Swal.showValidationMessage('يرجى إدخال رقم الجوال'); return false; }
                if (!address) { Swal.showValidationMessage('يرجى إدخال العنوان'); return false; }
                const cleanPhone = phone.replace(/[\s-]/g, '');
                if (!/^\+?\d{8,15}$/.test(cleanPhone)) {
                    Swal.showValidationMessage('رقم الجوال غير صحيح (مثال: 01012345678)');
                    return false;
                }
                return { name, phone: cleanPhone, address };
            }
        }).then(result => {
            if (result.isConfirmed && result.value) {
                const { name, phone, address } = result.value;
                showOrderReview(branchKey, name, phone, address);
            }
        });
    }

    function showOrderReview(branchKey, customerName, customerPhone, customerAddress) {
        const subtotal = getTotal();
        const grandTotal = subtotal + CONFIG.DELIVERY_FEE;

        const rowsHtml = cart.map(item => `
            <div class="os-row">
                <span>${escapeHtml(item.name)} × ${item.quantity}</span>
                <span>${formatPrice(item.price * item.quantity)}</span>
            </div>
        `).join('');

        Swal.fire({
            title: '✅ مراجعة الطلب',
            html: `
                <div style="text-align:right;font-size:0.9rem;margin-bottom:10px;">
                    👤 ${escapeHtml(customerName)} · 📱 ${escapeHtml(customerPhone)}<br>
                    📍 ${escapeHtml(customerAddress)}<br>
                    🏪 ${CONFIG.BRANCH_NAMES[branchKey]}
                </div>
                <div class="order-summary-box">
                    ${rowsHtml}
                    <div class="os-row" style="border-top:1px solid #E8DDD0;margin-top:6px;padding-top:6px;">
                        <span>المجموع الفرعي</span><span>${formatPrice(subtotal)}</span>
                    </div>
                    <div class="os-row"><span>رسوم التوصيل</span><span>${formatPrice(CONFIG.DELIVERY_FEE)}</span></div>
                    <div class="os-row" style="font-weight:bold;color:var(--primary);">
                        <span>الإجمالي</span><span>${formatPrice(grandTotal)}</span>
                    </div>
                </div>
            `,
            showCancelButton: true,
            cancelButtonText: '⟵ تعديل البيانات',
            cancelButtonColor: '#8a7a6a',
            confirmButtonText: 'إرسال عبر واتساب 📤',
            confirmButtonColor: '#25D366',
            allowOutsideClick: false
        }).then(result => {
            if (result.isConfirmed) {
                sendOrderViaWhatsApp(branchKey, customerName, customerPhone, customerAddress);
            } else if (result.dismiss === Swal.DismissReason.cancel) {
                showCustomerForm(branchKey, { name: customerName, phone: customerPhone, address: customerAddress });
            }
        });
    }

    function sendOrderViaWhatsApp(branchKey, customerName, customerPhone, customerAddress) {
        const subtotal = getTotal();
        const grandTotal = subtotal + CONFIG.DELIVERY_FEE;

        const orderLines = cart.map(item =>
            `• ${item.name} × ${item.quantity} = ${formatPrice(item.price * item.quantity)}`
        ).join('\n');

        const branchName = CONFIG.BRANCH_NAMES[branchKey];
        const branchPhone = CONFIG.BRANCH_PHONES[branchKey];

        const message = [
            '🍽️ *طلب جديد من كشري الزعيم*',
            '━━━━━━━━━━━━━━━━━━━━━',
            `👤 *الاسم:* ${customerName}`,
            `📱 *الجوال:* ${customerPhone}`,
            `📍 *العنوان:* ${customerAddress}`,
            `🏪 *الفرع:* ${branchName}`,
            '━━━━━━━━━━━━━━━━━━━━━',
            '📋 *تفاصيل الطلب:*',
            orderLines,
            '━━━━━━━━━━━━━━━━━━━━━',
            `💰 *إجمالي الطلب:* ${formatPrice(subtotal)}`,
            `🚚 *رسوم التوصيل:* ${formatPrice(CONFIG.DELIVERY_FEE)}`,
            `💎 *الإجمالي النهائي:* ${formatPrice(grandTotal)}`,
            '━━━━━━━━━━━━━━━━━━━━━',
            '🌟 شكراً لثقتكم بكشري الزعيم!'
        ].join('\n');

        const whatsappUrl = `https://wa.me/${branchPhone}?text=${encodeURIComponent(message)}`;
        const opened = window.open(whatsappUrl, '_blank');

        Swal.fire({
            icon: 'success',
            title: '🎉 تم تجهيز الطلب!',
            text: opened
                ? `تم فتح واتساب لإرسال طلبك إلى ${branchName}. أكمل الإرسال من هناك.`
                : 'يرجى السماح بالنوافذ المنبثقة، ثم اضغط هنا لإرسال الطلب.',
            confirmButtonText: opened ? 'حسناً' : 'فتح واتساب',
            confirmButtonColor: '#25D366',
            timer: opened ? 5000 : undefined,
            timerProgressBar: opened
        }).then(res => {
            if (!opened && res.isConfirmed) window.open(whatsappUrl, '_blank');
            cart = [];
            updateCartUI();
            renderCartModalContent();
            syncAllCardActions();
            closeModal();
        });
    }

    // ═══════════════════════════════════════════════════════════
    //  MODAL CONTROLS
    // ═══════════════════════════════════════════════════════════
    function openModal() {
        renderCartModalContent();
        dom.cartModal.setAttribute('aria-hidden', 'false');
        dom.cartModal.style.display = 'flex';
        document.body.style.overflow = 'hidden';
        dom.modalCloseFooter.focus();
    }

    function closeModal() {
        dom.cartModal.setAttribute('aria-hidden', 'true');
        dom.cartModal.style.display = 'none';
        document.body.style.overflow = '';
        dom.cartIconBtn.focus();
    }

    dom.cartIconBtn.addEventListener('click', openModal);
    dom.modalCloseFooter.addEventListener('click', closeModal);
    dom.deleteAllBtn.addEventListener('click', emptyCartWithConfirm);
    dom.checkoutBtn.addEventListener('click', startCheckout);

    dom.cartModal.addEventListener('click', (e) => {
        if (e.target === dom.cartModal) closeModal();
    });

    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isCartModalOpen()) closeModal();
    });

    // ═══════════════════════════════════════════════════════════
    //  BRANCHES PANEL
    // ═══════════════════════════════════════════════════════════
    function toggleBranchesPanel(show) {
        const isOpen = show ?? !dom.branchesPanel.classList.contains('show');
        dom.branchesPanel.classList.toggle('show', isOpen);
        dom.locationBtn.setAttribute('aria-expanded', String(isOpen));
    }

    dom.locationBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        toggleBranchesPanel();
    });

    document.addEventListener('click', (e) => {
        if (!dom.branchesPanel.contains(e.target) && !dom.locationBtn.contains(e.target)) {
            toggleBranchesPanel(false);
        }
    });

    dom.branchesPanel.addEventListener('click', (e) => {
        const opt = e.target.closest('.branch-option');
        if (!opt) return;
        const address = opt.dataset.address;
        const mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
        window.open(mapsUrl, '_blank', 'noopener');
        toggleBranchesPanel(false);
    });

    dom.branchesPanel.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') {
            const opt = e.target.closest('.branch-option');
            if (opt) { e.preventDefault(); opt.click(); }
        }
    });

    // ═══════════════════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════════════════
    function init() {
        if (dom.brandLogoImg) {
            dom.brandLogoImg.src = IMG.logo();
            dom.brandLogoImg.onerror = function () {
                this.onerror = null;
                this.src = IMG.fallback();
            };
        }

        const favicon = document.createElement('link');
        favicon.rel = 'icon';
        favicon.type = 'image/jpeg';
        favicon.href = IMG.logo();
        document.head.appendChild(favicon);

        storage.load();
        renderBottomCategories();
        renderMenuGrid();
        updateCartUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
    </script>
</body>
</html>
